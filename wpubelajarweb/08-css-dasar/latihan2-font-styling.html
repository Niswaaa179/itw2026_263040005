<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color:rgb(70, 44, 44);
      text-align: center;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 5px;
      text-shadow: 5px 10px 20px rgb(78, 35, 17), 0px -10px 5px gray;
      text-decoration: underline;
      text-decoration-style:dotted;
      text-decoration-color:rgb(82, 31, 31);
      
      
    }

    .quote {
      font-size: 22px;
      line-height: 1.7;
      word-spacing: 5px;
    }

    span {
      color: rgb(81, 33, 33);
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151, 151, 151);
      font-weight: normal;
    }
    </style>
</head>
<body>
    <h1>Suara yang Terabaikan </h1>

    <p class="quote">"Komunikasi itu bukan  soal siapa yang paling<span> banyak bicaranya</span>
    bukan juga siapa yang paling <span>keras suaranya</span>
    tapi siapa yang membuat orang lain benar-benar mengerti apa yang kita maksud,
    karena semua orang hanya ingin di denger."</p>

    <p class="credit">— AqeelaCalista</p>
    
</body>
</html>
