<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Backgroung</title>
    <style>
        body{
            min-height:100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color:#333 ;
        }

        .frame{
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin:auto;
            background-image: url(img/niswa-transparan.png), url(img/blob.png), url(img/bg-bawah.png);
            background-size: 320px, 250px, 670px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: center bottom, center 25%, bottom center;
            background-color: #f0f0f0;
            border-radius: 50%;
        }
        
        h1 {
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40;
            text-shadow: 2px 2px 3px black;
        }
    </style>


</head>
<body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
    
</body>
</html>
