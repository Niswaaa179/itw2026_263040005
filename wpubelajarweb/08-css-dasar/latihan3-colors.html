<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color:#f8f8ff;
      text-align: center;
      background-color: #0F172A;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 5px;
      text-decoration: underline;
      text-decoration-style:wavy;
      text-decoration-color: #ebf1fe;
      text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      color: #38BAF4;
      
      
    }

    .quote {
      font-size: 22px;
      line-height: 1.7;
      word-spacing: 5px;
    }

    span {
      color: #8e1f1f;
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151, 151, 151);
      font-weight: normal;
    }
    </style>
</head>
<body>
    <h1>Suara yang Terabaikan </h1>

    <p class="quote">"Komunikasi itu bukan  soal siapa yang paling<span> banyak bicaranya</span>
    bukan juga siapa yang paling <span>keras suaranya</span>
    tapi siapa yang membuat orang lain benar-benar mengerti apa yang kita maksud,
    karena semua orang hanya ingin di denger."</p>

    <p class="credit">— AqeelaCalista</p>
    
</body>
</html>
