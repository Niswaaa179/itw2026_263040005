<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
    body {
      background-color: lightblue;
      background-image: linear-gradient(to right, navy, lightblue);
      height:100vh;
    }

    .kotak {
      width: 300px;
      height: 300px;
      background-color:lightpink;
      background-image: linear-gradient(to bottom, purple, pink);
    }

    .kotak2 {
      width: 300px;
      height: 300px;
      background-color:lightpink;
      background-image: radial-gradient(yellow, red);
    }
  
    .kotak3 {
      width: 300px;
      height: 300px;
      background-color:lightpink;
      background-image: conic-gradient(navy, pink, skyblue);

    }
  </style>
</head>
<body>
    <div class="kotak"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
    
    
</body>
</html>
