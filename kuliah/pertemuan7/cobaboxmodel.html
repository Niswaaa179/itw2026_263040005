<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Box Model</title>
    <style>
        .kotak1 {
            width: 300px;
            height: 100px;
            background-color:plum;
            margin:50px 30px 20px 40px;
            padding:30px;
            border: 5px lightslategray solid;
            box-sizing: border-box ;
        }
        .kotak2 {
            width: 250px;
            height: 150px;
            background-color: lightblue;
            margin: 30px auto 40px;
            padding:30px;
            border: 5px lightgray solid;
            box-sizing: border-box ;

        }
        .kotak3 {
            width: 200px;
            height: 200px;
            background-color: lightpink;
            margin: 40px 20px 30px 10px;
        }
        .kotak4 {
            width: 250px;
            height: 250px;
            background-color: lightgreen;
            margin: 50px auto 40px;
        }
    </style>
</head>
<body>
    <div class="kotak1">Niswa baik hati & tidak sombong</div>
    <div class="kotak2">Niswa imut & Lucu</div>
    <div class="kotak3">kotak pink</div>
    <div class="kotak4">kotak hijau</div>
</body>
</html>
